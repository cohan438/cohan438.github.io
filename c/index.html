<!doctype html><meta charset=utf-8><meta name=robots content=noindex><title>AC DRUMS</title><script>
// /c#YYYYMMDDHHMM[-MIN][-t]  → Google Calendar "add event" (no storage needed)
var h=location.hash.slice(1),m=/^(\d{8})(\d{4})(?:-(\d{1,3}))?(-t)?$/.exec(h);
if(m){var d=m[1],t=m[2],min=+(m[3]||60),s=new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6),+t.slice(0,2),+t.slice(2)),e=new Date(s.getTime()+min*6e4),
f=function(x){return x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00'};
location.replace('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(m[4]?'שיעור ניסיון AC DRUMS':'שיעור תופים AC DRUMS')+'&dates='+f(s)+'/'+f(e)+'&ctz=Asia/Jerusalem&location='+encodeURIComponent('AC DRUMS, סלעית'))}
</script>
